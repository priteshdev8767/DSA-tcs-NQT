<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSA TCS NQT Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <div class="w-1/4 bg-blue-600 text-white p-4 overflow-y-auto">
      <h2 class="text-xl font-bold mb-4">Files</h2>
      <ul id="fileList"></ul>
    </div>

    <!-- Code Viewer -->
    <div class="w-3/4 p-4 overflow-y-auto">
      <h2 class="text-xl font-bold mb-2">Code Viewer</h2>
      <pre id="code" class="bg-black text-green-400 p-4 rounded overflow-auto"></pre>
    </div>

  </div>

<script src="script.js"></script>

</body>
</html>
